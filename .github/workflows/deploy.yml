# 构建多架构镜像推送到 GHCR 与腾讯云 TCR 个人版，SSH 部署到阿里云 ECS / 腾讯云 CVM（均从 TCR 拉取）
#
# Secrets（<PREFIX> 为 ALIYUN 或 TENCENT）：<PREFIX>_HOST、<PREFIX>_PORT（默认 22）、<PREFIX>_USER、<PREFIX>_SSH_KEY、<PREFIX>_PATH、TENCENT_TCR_PASSWORD
# Variables：TENCENT_TCR_REGISTRY、TENCENT_TCR_NAMESPACE、TENCENT_TCR_USERNAME（TCR 仓库为 <命名空间>/fastapi-template）
# Environments：aliyun-production / tencent-production

name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否部署到服务器'
        required: true
        default: true
        type: boolean
      target:
        description: '部署目标'
        required: true
        default: aliyun
        type: choice
        options: [aliyun, tencent, all]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fastapi-template
  IMAGE_BASENAME: fastapi-template

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      git_hash: ${{ steps.info.outputs.git_hash }}
      build_time: ${{ steps.info.outputs.build_time }}
      image_tcr: ${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }}:${{ steps.info.outputs.git_hash }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate build info
        id: info
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "git_hash=$(git rev-parse --short HEAD)"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "branch=${SOURCE_BRANCH}"
            echo "branch_tag=${SOURCE_BRANCH//\//-}"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: repo
        run: |
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          tcr_image_name="${TCR_NAMESPACE}/${IMAGE_BASENAME}"
          echo "tcr_image_name=${tcr_image_name,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify TCR config
        if: inputs.deploy
        run: |
          has_error=0
          for var in TENCENT_TCR_REGISTRY TENCENT_TCR_NAMESPACE TENCENT_TCR_USERNAME TENCENT_TCR_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${var}（在仓库 Actions Variables / Secrets 中配置）"
              has_error=1
            fi
          done
          [[ $has_error -eq 1 ]] && exit 1 || true
        env:
          TENCENT_TCR_REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          TENCENT_TCR_NAMESPACE: ${{ vars.TENCENT_TCR_NAMESPACE }}
          TENCENT_TCR_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          TENCENT_TCR_PASSWORD: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Login to TCR
        if: inputs.deploy
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.TENCENT_TCR_REGISTRY }}
          username: ${{ vars.TENCENT_TCR_USERNAME }}
          password: ${{ secrets.TENCENT_TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.repo.outputs.image_name }}
            name=${{ vars.TENCENT_TCR_REGISTRY }}/${{ steps.repo.outputs.tcr_image_name }},enable=${{ inputs.deploy }}
          tags: |
            type=raw,value=${{ steps.info.outputs.git_hash }}
            type=raw,value=${{ steps.info.outputs.branch_tag }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.info.outputs.branch == 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: production
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: inputs.deploy
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'all' && '[{"key":"ALIYUN","name":"阿里云 ECS","environment":"aliyun-production"},{"key":"TENCENT","name":"腾讯云 CVM","environment":"tencent-production"}]' || inputs.target == 'tencent' && '[{"key":"TENCENT","name":"腾讯云 CVM","environment":"tencent-production"}]' || '[{"key":"ALIYUN","name":"阿里云 ECS","environment":"aliyun-production"}]') }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deploy secrets
        env:
          PREFIX: ${{ matrix.key }}
          SSH_HOST: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          SSH_USER: ${{ secrets[format('{0}_USER', matrix.key)] }}
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          DEPLOY_PATH: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}
        run: |
          has_error=0
          for pair in HOST:SSH_HOST USER:SSH_USER SSH_KEY:SSH_KEY PATH:DEPLOY_PATH; do
            var="${pair#*:}"
            if [[ -z "${!var}" ]]; then
              echo "::error::缺少 ${PREFIX}_${pair%%:*} secret"
              has_error=1
            fi
          done
          if [[ -z "$REGISTRY_TOKEN" ]]; then
            echo "::error::缺少 TENCENT_TCR_PASSWORD secret"
            has_error=1
          fi
          if [[ $has_error -eq 1 ]]; then
            echo "请在 Settings -> Secrets and variables -> Actions 中配置以上 secrets"
            exit 1
          fi
          echo "Secrets 配置检查通过"

      - name: Sync deploy files to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          port: ${{ secrets[format('{0}_PORT', matrix.key)] || 22 }}
          username: ${{ secrets[format('{0}_USER', matrix.key)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          source: 'docker/docker-compose.ecs.yaml,deploy/manage.sh'
          target: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          strip_components: 0

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets[format('{0}_PATH', matrix.key)] }}
          REGISTRY: ${{ vars.TENCENT_TCR_REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.TENCENT_TCR_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.TENCENT_TCR_PASSWORD }}
          IMAGE_FULL_NAME: ${{ needs.build-and-push.outputs.image_tcr }}
        with:
          host: ${{ secrets[format('{0}_HOST', matrix.key)] }}
          port: ${{ secrets[format('{0}_PORT', matrix.key)] || 22 }}
          username: ${{ secrets[format('{0}_USER', matrix.key)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', matrix.key)] }}
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_PATH,REGISTRY,REGISTRY_USERNAME,REGISTRY_TOKEN,IMAGE_FULL_NAME
          script: |
            set -e

            cd "$DEPLOY_PATH"

            chmod +x deploy/manage.sh

            echo "Logging in to ${REGISTRY}..."
            trap 'docker logout "${REGISTRY}" >/dev/null 2>&1 || true' EXIT
            echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

            echo "Pulling image: ${IMAGE_FULL_NAME}..."
            IMAGE_FULL_NAME="${IMAGE_FULL_NAME,,}"

            retry=0
            max_retries=3
            until docker pull "${IMAGE_FULL_NAME}" || [ $retry -eq $max_retries ]; do
              retry=$((retry + 1))
              echo "  Retry $retry/$max_retries for ${IMAGE_FULL_NAME}..."
              sleep 10
            done

            if ! docker image inspect "${IMAGE_FULL_NAME}" >/dev/null 2>&1; then
              echo "Failed to pull image after $max_retries attempts"
              exit 1
            fi
            echo "Image pulled successfully"

            export IMAGE_FULL_NAME
            echo "IMAGE_FULL_NAME=${IMAGE_FULL_NAME}" > .env.image
            compose=(docker compose --env-file .env)
            if [ -f .env.image ]; then
              compose+=(--env-file .env.image)
            fi
            compose+=(-f docker/docker-compose.ecs.yaml)
            HEALTH_PROBE='import os, urllib.request as r; t = os.environ.get("METRICS_TOKEN"); r.urlopen(r.Request("http://localhost:" + os.environ.get("APP_PORT", "3000") + "/" + os.environ.get("API_PREFIX", "api") + "/v1/health/ready", headers={"Authorization": "Bearer " + t} if t else {}), timeout=5)'

            echo "Running migrations..."
            "${compose[@]}" run --rm migrate

            echo "Restarting services..."
            "${compose[@]}" up -d --remove-orphans

            echo "Waiting for API to be healthy..."
            for i in $(seq 1 30); do
              if "${compose[@]}" exec -T api python -c "$HEALTH_PROBE" 2>/dev/null; then
                echo "API is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API health check failed after 30 attempts"
                "${compose[@]}" logs api --tail=50
                exit 1
              fi
              echo "  Attempt $i/30..."
              sleep 5
            done

            echo "Cleaning up old images..."
            IMAGE_REPO="${IMAGE_FULL_NAME%:*}"
            docker images "${IMAGE_REPO}" -q | tail -n +4 | xargs -r docker rmi -f || true

            echo "Deployment completed!"
            echo "Deployed image: ${IMAGE_FULL_NAME}"

  cleanup:
    name: Cleanup Registry
    needs: [build-and-push, deploy]
    if: >-
      always() && needs.build-and-push.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/cleanup-registry.yml
    permissions:
      contents: read
      packages: write
    secrets:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

  notify:
    name: Notify
    needs: [build-and-push, deploy, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Deployment summary
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_RESULT: ${{ needs.deploy.result || 'skipped' }}
          CLEANUP_RESULT: ${{ needs.cleanup.result || 'skipped' }}
          GIT_HASH: ${{ needs.build-and-push.outputs.git_hash }}
          BUILD_TIME: ${{ needs.build-and-push.outputs.build_time }}
        run: |
          {
            echo "# 部署结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|------|------|"
            echo "| 构建推送 | ${BUILD_RESULT} |"
            echo "| 部署（${DEPLOY_TARGET}） | ${DEPLOY_RESULT} |"
            echo "| 镜像清理 | ${CLEANUP_RESULT} |"
            echo ""
            echo "**Git Hash**: \`${GIT_HASH}\`"
            echo "**构建时间**: ${BUILD_TIME}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${DEPLOY_RESULT}" == "failure" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 部署失败，请检查日志排查问题" >> "$GITHUB_STEP_SUMMARY"
          fi
