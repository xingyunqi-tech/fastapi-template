default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: ^openapi/
      - id: trailing-whitespace
        exclude: ^openapi/

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1 git --pre-commit --staged --redact --no-banner
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude --exit-non-zero-on-format
        language: system
        types: [python]
        require_serial: true

      - id: typos
        name: typos
        entry: uv run --frozen typos --force-exclude
        language: system
        types: [text]

      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: commit-msg
        name: conventional commits
        entry: uv run --frozen python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: make-check
        name: make check
        entry: make check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
