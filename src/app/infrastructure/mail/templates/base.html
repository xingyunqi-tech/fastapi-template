<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;font-family:Arial,sans-serif;color:#333333">
<table role="presentation" style="border:0;width:100%;max-width:600px;margin:0 auto">
<tr><td style="padding:24px;font-size:24px;font-weight:600">{{ app_name }}</td></tr>
<tr><td style="padding:0 24px 16px;font-size:16px;line-height:1.5">{{ body }}</td></tr>
<tr><td style="padding:8px 24px 24px"><a href="{{ url }}" style="display:inline-block;padding:12px 20px;background:#00838f;color:#ffffff;text-decoration:none;border-radius:4px">{{ action }}</a></td></tr>
<tr><td style="padding:0 24px 8px;font-size:13px;color:#808080;word-break:break-all">{{ url }}</td></tr>
<tr><td style="padding:0 24px 24px;font-size:13px;color:#808080">{{ expires }}</td></tr>
</table>
</body>
</html>
