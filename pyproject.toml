[project]
name = "fastapi-temp"
version = "0.1.0"
description = "FastAPI 后端模板，API 契约与 nestjs-template 一致"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "granian>=2.8.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "orjson>=3.13.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.74.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette>=1.10.0",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "typer>=0.29.0",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "coverage[toml]>=7.17.2",
    "fastapi-cli>=0.0.20",
    "httpx2>=2.16.0",
    "mypy>=2.3.1",
    "prek>=0.5.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "testcontainers[minio,postgres,redis]>=4.15.0",
    "time-machine>=2.16.0",
    "ty>=0.0.100",
    "types-aioboto3>=15.5.0",
    "typos>=1.51.1",
    "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "TC",
    "DTZ", "PERF", "LOG", "G", "N", "PLC", "PLE", "PLW", "FAST",
]

allowed-confusables = ["，", "：", "；", "（", "）", "！", "？", "、", "。"]

ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"migrations/**" = ["TC"]
"src/app/**/router.py" = ["TC"]
"src/app/**/deps.py" = ["TC"]
"src/app/common/params.py" = ["TC"]
"src/app/common/context.py" = ["TC"]
"src/app/infrastructure/database/session.py" = ["TC"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "app.infrastructure.database.base.Base",
    "pydantic.BaseModel",
    "app.contract.schemas.ContractModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: 纯单元测试，不依赖外部服务",
    "integration: 依赖 testcontainers 启动的 Postgres / Redis",
    "e2e: 对 compose 启动的完整服务发请求",
    "contract: OpenAPI 与 validation.json 契约比对",
    "parity: 与 nestjs-template 同请求比对",
    "committed: 依赖真实提交，使用独立克隆库",
]

[tool.coverage.run]
branch = true
source = ["app"]
parallel = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.typos.files]
extend-exclude = ["uv.lock", "openapi/*.json", "db/*.sql", "src/app/cli/seed_data/*.json"]

[tool.typos.default]
extend-ignore-re = ["(PK|FK|UQ|REL|IDX)_[0-9a-f]{20,}"]
