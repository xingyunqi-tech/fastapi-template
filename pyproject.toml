[project]
name = "fastapi-temp"
version = "0.1.0"
description = "FastAPI 后端模板，API 契约与 nestjs-template 一致"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.4",
    "granian>=2.8.7",
    "orjson>=3.13.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "starlette>=1.10.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.17.2",
    "fastapi-cli>=0.0.20",
    "httpx2>=2.16.0",
    "mypy>=2.3.1",
    "prek>=0.5.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "typos>=1.51.1",
    "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "TC",
    "DTZ", "PERF", "LOG", "G", "N", "PLC", "PLE", "PLW", "FAST",
]

allowed-confusables = ["，", "：", "；", "（", "）", "！", "？", "、", "。"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
python_version = "3.15"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "unit: 纯单元测试，不依赖外部服务",
    "integration: 依赖 testcontainers 启动的 Postgres / Redis",
    "e2e: 对 compose 启动的完整服务发请求",
    "contract: OpenAPI 与 validation.json 契约比对",
    "parity: 与 nestjs-template 同请求比对",
    "committed: 依赖真实提交，使用独立克隆库",
]

[tool.coverage.run]
branch = true
source = ["app"]
parallel = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.typos.files]
extend-exclude = ["uv.lock", "openapi/*.json", "db/*.sql"]
