# 各环境共用的服务：Mailpit、migrate（一次性）、api（Granian）
#
# 用法：
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.postgres.yaml up

name: fastapi-temp-dev

x-app: &app
  build: &app-build
    context: ..
    dockerfile: Dockerfile
    target: production
  image: fastapi-temp:local
  env_file:
    - ../.env.example
  environment: &app-env
    DATABASE_URL: postgresql://${DATABASE_USERNAME:-root}:${DATABASE_PASSWORD:-secret}@postgres:5432/${DATABASE_NAME:-api}?sslmode=disable
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'

services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAIL_CLIENT_PORT:-1080}:8025'
      - '${MAIL_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    <<: *app
    command:
      - sh
      - -c
      - >-
        app migrate
        && if [ "$${RUN_SEEDS:-false}" = true ]; then app seed; fi
    restart: 'no'

  api:
    <<: *app
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$${APP_PORT:-3000}/health/live', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 2s
