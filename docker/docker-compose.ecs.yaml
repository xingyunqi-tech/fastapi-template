# ECS 服务器部署配置（GHCR 镜像模式）
#
# 首次部署：
#   1. 在服务器上创建部署目录（对应 ALIYUN_DEPLOY_PATH secret）
#   2. 部署目录放置 .env（参考 .env.example，生产密钥、MAIL_*、METRICS_TOKEN 等）
#   3. 后续部署由 CI/CD 同步本文件与 manage.sh 并重启服务
#
# 手动操作：
#   ./deploy/manage.sh start|stop|restart|logs|status|health

name: fastapi-temp

x-app: &app
  image: ${IMAGE_FULL_NAME:-ghcr.io/xingyunqi-tech/fastapi-template:latest}
  env_file:
    - ../.env
  networks:
    - app-network

x-app-env: &app-env
  APP_ENV: production
  APP_PORT: '3000'
  DATABASE_HOST: postgres
  DATABASE_PORT: '5432'
  REDIS_ENABLED: 'true'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

services:
  # api 与 worker 共用的 PID 命名空间，保证共享 PROMETHEUS_MULTIPROC_DIR 中按 PID 命名的文件不冲突
  pidns:
    image: ${IMAGE_FULL_NAME:-ghcr.io/xingyunqi-tech/fastapi-template:latest}
    container_name: fastapi-pidns
    command: ['python', '-c', 'import signal, sys; signal.signal(signal.SIGTERM, lambda *_: sys.exit(0)); signal.pause()']
    network_mode: none
    healthcheck:
      test: ['CMD', 'true']
      interval: 30s
    restart: unless-stopped

  migrate:
    <<: *app
    container_name: fastapi-migrate
    command:
      - sh
      - -c
      - >-
        app migrate
        && app permissions clear-cache
        && if [ "$${RUN_SEEDS:-false}" = true ]; then app seed; fi
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    container_name: fastapi-api
    pid: service:pidns
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - uploaded-files:/app/files
      - prometheus-multiproc:/tmp/prometheus
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import os, urllib.request; urllib.request.urlopen('http://localhost:3000/' + os.environ.get('API_PREFIX', 'api') + '/v1/health/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    container_name: fastapi-worker
    command: ['app', 'worker']
    pid: service:pidns
    volumes:
      - uploaded-files:/app/files
      - prometheus-multiproc:/tmp/prometheus
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import glob, sys; sys.exit(not any(open(f, "rb").read().endswith(b"/bin/app\0worker\0") for f in glob.glob("/proc/[0-9]*/cmdline")))',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    container_name: fastapi-scheduler
    command: ['app', 'scheduler']
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import glob, sys; sys.exit(not any(open(f, "rb").read().endswith(b"/bin/app\0scheduler\0") for f in glob.glob("/proc/[0-9]*/cmdline")))',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine
    container_name: fastapi-postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-api}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-root} -d ${DATABASE_NAME:-api}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:8.10.3-alpine
    container_name: fastapi-redis
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:
  uploaded-files:
  prometheus-multiproc:

networks:
  app-network:
    driver: bridge
