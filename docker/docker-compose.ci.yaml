# CI / e2e：生产镜像（APP_ENV=production）起完整服务栈，宿主端口随机分配（docker compose port 查询）
#
# 用法：
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.postgres.yaml -f docker/docker-compose.redis.yaml -f docker/docker-compose.ci.yaml -p fastapi-e2e up --build --wait

x-ci-env: &ci-env
  APP_ENV: production
  APP_FRONTEND_URL: https://app.example.com
  AUTH_ISSUER: https://identity.ci
  AUTH_AUDIENCE: ci-api
  # 与 tests/keys.py 相同的测试密钥，仅用于 CI
  AUTH_SIGNING_KEY: "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIIfsCwlN9KBxNWmO/r4h9O5HYHy12QqyuUnx96zHD0pL\n-----END PRIVATE KEY-----\n"
  MAIL_FROM: Api <noreply@example.com>
  MAIL_TLS: none
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ADMIN_PASSWORD: Secret00
  DOCS_ENABLED: 'true'
  METRICS_TOKEN: ci_metrics_token_0123456789abcdef
  CORS_ORIGINS: https://app.example.com
  STORAGE_URL_SECRET: ci_storage_url_secret_0123456789
  TRUSTED_PROXIES: '1'

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mailpit:
    ports: !override
      - '127.0.0.1::8025'

  migrate:
    environment:
      <<: *ci-env
      APP_ENV: test
      RUN_SEEDS: 'true'

  api:
    ports: !override
      - '127.0.0.1::3000'
    environment: *ci-env

  worker:
    environment: *ci-env

  scheduler:
    environment: *ci-env
